[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pto-asl-model"
version = "0.1.0"
description = "ASL-backed functional model runtime for PTO instruction validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "PTO-ISA contributors"}]
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
asl-model = "asl_model.cli:main"

[tool.pto-asl-model]
# The strict closure runner remains ``pto_asl_model``.  The separate
# ``asl_model`` package provides bounded smoke, persistent-session, and
# multi-PE bring-up without weakening the closure contract.
default-profile = "portable"
cache-directory = ".cache"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pto_asl_model = ["architecture_state.schema.json"]
asl_model = ["cases.json", "embedded/Worker.ml", "runtime/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
