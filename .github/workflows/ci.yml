name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and test
        run: make check

  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact PTO-SPEC development lock
        id: pto
        shell: bash
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("dependencies/pto-spec.lock"))["commit"])')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact PTO-SPEC development input
        uses: actions/checkout@v4
        with:
          repository: PTO-ISA/pto-spec
          ref: ${{ steps.pto.outputs.commit }}
          path: vendor/pto-spec
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned OCaml toolchain
        uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3
        with:
          ocaml-compiler: 5.2.1
          opam-disable-sandboxing: true

      - name: Build exact PTO-SPEC and ASLRef inputs
        env:
          PTO_ASLREF_ROOT: ${{ github.workspace }}/vendor/pto-spec/.cache/herdtools7
        run: make -C vendor/pto-spec setup build

      - name: Exercise persistent worker and Linx host access
        env:
          PTO_SPEC_ROOT: ${{ github.workspace }}/vendor/pto-spec
          PTO_ASLREF_ROOT: ${{ github.workspace }}/vendor/pto-spec/.cache/herdtools7
          PYTHONPATH: src
        run: |
          python3 -m unittest \
            tests.test_asl_model.AslModelFrameworkTest.test_integration_spec_matches_development_lock \
            tests.test_asl_embedded_session.EmbeddedAslRefIntegrationTest \
            -v

  shared-library-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, and install shared library
        run: |
          cmake -S . -B build-shared-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DPTO_ASL_MODEL_BUILD_TESTS=ON
          cmake --build build-shared-ci -j 8
          cmake --install build-shared-ci --prefix "$PWD/install-shared-ci"
      - name: Verify shared-library ABI
        shell: bash
        run: |
          set -euo pipefail
          library=build-shared-ci/libpto_asl_model.so.2
          installed_library=install-shared-ci/lib/libpto_asl_model.so.2
          test -f "$library"
          test -f "$installed_library"
          soname="$(readelf -d "$library" | sed -n 's/.*(SONAME).*\[\(.*\)\].*/\1/p')"
          test "$soname" = libpto_asl_model.so.2
          nm -D --defined-only --format=posix "$library" \
            | awk '{print $1}' \
            | LC_ALL=C sort -u > build-shared-ci/defined-exports.txt
          printf '%s\n' pto_model_run_elf > build-shared-ci/expected-exports.txt
          diff -u \
            build-shared-ci/expected-exports.txt \
            build-shared-ci/defined-exports.txt
      - name: Verify installed package consumers
        run: |
          cmake -S tests/cmake_package_consumer/shared \
            -B build-package-consumer-shared-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-shared-ci"
          cmake --build build-package-consumer-shared-ci -j 8
          ctest --test-dir build-package-consumer-shared-ci --output-on-failure
          cmake -S tests/cmake_package_consumer/static \
            -B build-package-consumer-static-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-shared-ci"
          cmake --build build-package-consumer-static-ci -j 8
          ctest --test-dir build-package-consumer-static-ci --output-on-failure
